# Optional local fallback only. The app uses cloud Supabase Postgres via .env.
services:
  db:
    image: postgres:16-alpine
    container_name: elva-investa-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: elva
      POSTGRES_PASSWORD: elva
      POSTGRES_DB: elva_investa
    volumes:
      - elva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elva -d elva_investa"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  elva_pgdata:
